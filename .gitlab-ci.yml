stages:
  - install
  - quality
  # - build

# point npm at a folder we can list as a path in "cache" job settings
variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# cache using branch name
# https://gitlab.com/help/ci/caching/index.md
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules
    - .npm

# this job installs NPM dependencies
install:
  stage: install
  image: node:18.20

  script:
    - npm install
  artifacts:
    name: "artifacts"
    untracked: true
    expire_in: 30 mins
    paths:
      - node_modules

# quality:lint:
#   stage: quality
#   image: node:18.20
#   script:
#     - npm run lint

quality:unit:
  stage: quality
  image: node:18.20
  script:
    - npm run test:cover
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/

